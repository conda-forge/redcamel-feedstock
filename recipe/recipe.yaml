schema_version: 1

context:
  name: redcamel
  version: "0.1.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/redcamel-${{ version }}.tar.gz
  sha256: 4319b544f57186ede64a2fd0113405a4af1b2ec6cc27fc1d42ab747014727470

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - redcamel = redcamel.remi_gui:main

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.11.28,<0.12.0
    - pip
  run:
    - python >=${{ python_min }}
    - chemformula >=1.2
    - python-graphviz >=0.20
    - h5py >=3.16,<4
    - ipykernel >=6,<7
    - ipywidgets >=8
    - ipympl >=0.9,<0.10
    - matplotlib-base >=3.7
    - numba >=0.65
    - numpy >=1.2
    - plopp >=26.3, <27
    - scipp >=25.12, <27
    - scipy >=1.17,<2

tests:
  - python:
      imports:
        - redcamel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://codeberg.org/FlashREMI/RedCamel
  repository: https://codeberg.org/FlashREMI/RedCamel
  summary: GUI tool to simulate Reaction Microscope detector images.
  license: GPL-3.0-or-later
  license_file:
    - LICENSES/
    - "REUSE.toml"
    - "CITATION.cff"

extra:
  recipe-maintainers:
    - HLinde
